# ============================================================
# torrent-tool nginx 反代配置（参考）
#
# 说明：
#  - 后端只监听 127.0.0.1:10011，公网一律经反代进入
#  - /mcp 是 MCP Streamable HTTP 端点，需要关闭缓冲、放开长连接超时
#  - 本文件是「新增 location」的参考，请合并进你已有的 server{} 块，
#    不要整段覆盖你现有的 nginx 配置
# ============================================================

# ---- 若你需要在反代层再加一层 Basic Auth（推荐：MCP 端点也一并保护）----
#  htpasswd -c /etc/nginx/torrent-tool.htpasswd admin

server {
    listen 443 ssl;
    http2 on;
    server_name 你的域名;

    ssl_certificate     /etc/letsencrypt/live/你的域名/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/你的域名/privkey.pem;

    # ---- 客户端上传大小（本服务不接收文件上传，仅作防护）----
    client_max_body_size 1m;

    # ---- 常规 Web 后台 / API ----
    location / {
        proxy_pass http://127.0.0.1:10011;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 后端自己会取 XFF 的第一个值做限流/审计，必须原样透传
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- MCP Streamable HTTP（POST + SSE 长连接）----
    location /mcp {
        proxy_pass http://127.0.0.1:10011;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 事件流：必须关闭缓冲，否则流式响应会被 nginx 攒住
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 深度检测（L2）最长 90s，超时要留够
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }
}
